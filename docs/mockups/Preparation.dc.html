<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Préparation de partie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&amp;family=Inter:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#4FE3D2}a:hover{color:#ECE8FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #120E22; color: #ECE8FF; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; padding: 44px 16px 24px; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; gap: 10px">
    <a href="Hub.dc.html" aria-label="Retour" style="width: 44px; height: 44px; background: #1E1838; border: 1px solid #4A3D7A; border-radius: 10px; color: #ECE8FF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3L5 9l6 6" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <span style="font-family: 'Pixelify Sans', monospace; font-size: 20px">1-8 LA SOURCE FLÉTRIE</span>
      <span style="font-size: 12px; color: #A99FD0">Purification · Bois des Lucioles</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <div style="background: #1E1838; border: 1px solid #4A3D7A; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 11px; color: #A99FD0">Puissance recommandée</span>
      <span style="font-family: 'Pixelify Sans', monospace; font-size: 22px">640</span>
    </div>
    <div style="background: #1E1838; border: 1px solid #6FE39A; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 11px; color: #A99FD0">Ta puissance</span>
      <span style="font-family: 'Pixelify Sans', monospace; font-size: 22px; color: #6FE39A">702</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 12px; color: #A99FD0">Ennemis rencontrés</span>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px">
      <span style="background: #1E1838; border: 1px solid #4A3D7A; border-radius: 12px; padding: 4px 10px">Champignon sauteur</span>
      <span style="background: #1E1838; border: 1px solid #4A3D7A; border-radius: 12px; padding: 4px 10px">Lapin-épine</span>
      <span style="background: #1E1838; border: 1px solid #6FE39A; border-radius: 12px; padding: 4px 10px; color: #6FE39A">Dryade flétrie · Soigneur</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 12px; color: #A99FD0">Le Cercle</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{party}}" as="p" hint-placeholder-count="3">
        <button style="background: #1E1838; border: 1px solid {{p.border}}; border-radius: 10px; padding: 10px 6px; color: #ECE8FF; display: flex; flex-direction: column; align-items: center; gap: 4px">
          <span style="width: 40px; height: 40px; border-radius: 50%; background: #2A2150; border: 2px solid {{p.border}}"></span>
          <span style="font-size: 13px; font-weight: 600">{{p.name}}</span>
          <span style="font-size: 11px; color: #A99FD0">{{p.desc}}</span>
          <span style="font-size: 11px; color: #A99FD0">{{p.side}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #A99FD0"><span>Deck de sorts</span><a href="#">Bibliothèque</a></div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{deck}}" as="d" hint-placeholder-count="5">
        <button style="height: 64px; background: #1E1838; border: 1px solid {{d.border}}; border-radius: 10px; color: #ECE8FF; font-size: 11px; line-height: 1.2; padding: 4px">{{d.name}}</button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 12px; color: #A99FD0">Potions</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <button style="height: 44px; background: #1E1838; border: 1px solid #5AA9FF; border-radius: 10px; color: #ECE8FF; font-size: 12px">Mana mineure</button>
      <button style="height: 44px; background: #1E1838; border: 1px solid #F2C46B; border-radius: 10px; color: #ECE8FF; font-size: 12px">Fiole de Barrière</button>
      <button style="height: 44px; background: #120E22; border: 1px dashed #4A3D7A; border-radius: 10px; color: #A99FD0; font-size: 12px">Vide</button>
    </div>
  </div>

  <label style="display: flex; align-items: center; gap: 10px; background: #1E1838; border: 1px solid #4A3D7A; border-radius: 10px; padding: 10px 12px; font-size: 13px">
    <input type="checkbox" style="width: 20px; height: 20px; accent-color: #F2C46B">
    <span style="flex: 1">Mode solo (sans bots)</span>
    <span style="font-size: 12px; color: #F2C46B">+25 % XP</span>
  </label>

  <div style="flex: 1"></div>
  <a href="Main.dc.html" style="height: 56px; background: #F2C46B; color: #1A1230; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Pixelify Sans', monospace; font-size: 20px">LANCER LA PARTIE</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      party: [
        { name: 'Brann', desc: 'Nain · Chevalier', side: 'Gauche', border: '#A99FD0' },
        { name: 'Toi', desc: 'Elfe · Mage', side: 'Centre', border: '#4FE3D2' },
        { name: 'Sylwen', desc: 'Elfe · Archère', side: 'Droite', border: '#A99FD0' }
      ],
      deck: [
        { name: 'Boule de feu', border: '#4A3D7A' },
        { name: 'Pluie de givre', border: '#4A3D7A' },
        { name: 'Purifier', border: '#D93CF2' },
        { name: 'Racines', border: '#4A3D7A' },
        { name: 'Don : Pas de brise', border: '#F2C46B' }
      ]
    };
  }
}
</script>
</body>
</html>
