name: Web build & GitHub Pages

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Godot et les modèles d'export web
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot" && rm godot.zip
          curl -sSL -o tpl.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j tpl.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d "$dest"
          rm tpl.tpz

      - name: Empreinte de version (bouton « Vérifier les mises à jour » des Options)
        run: |
          python3 - <<'PY'
          import datetime, json, os, subprocess
          title = subprocess.run(["git", "log", "-1", "--pretty=%s"], capture_output=True, text=True).stdout.strip()
          info = {"sha": os.environ["GITHUB_SHA"][:7], "time": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "title": title}
          open("data/build.json", "w", encoding="utf-8").write(json.dumps(info, ensure_ascii=False))
          print(info)
          PY

      - name: Importer le projet
        run: $RUNNER_TEMP/godot --headless --import --path .

      - name: Test de fumée de l'interface
        run: $RUNNER_TEMP/godot --headless --path . --script res://tools/ui_smoke.gd | tee smoke.log && grep -q "OK smoke" smoke.log

      - name: Simulation d'équilibrage (1-8)
        run: $RUNNER_TEMP/godot --headless --path . --script res://tools/sim_cli.gd -- --level=z01_l08 --runs=3

      - name: Export web
        run: |
          mkdir -p build/web && touch build/.gdignore
          $RUNNER_TEMP/godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.wasm
          cp data/build.json build/web/version.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      # Copie de secours sur la branche gh-pages (utile si Pages est réglé sur « Deploy from a branch »).
      - name: Publier sur la branche gh-pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone -q --depth 1 --branch gh-pages "$remote" site; then
            mkdir site && cd site && git init -q && git checkout -q -b gh-pages && git remote add origin "$remote" && cd ..
          fi
          rsync -a --delete --exclude .git --exclude '*.import' build/web/ site/
          touch site/.nojekyll
          cd site
          git add -A
          if git diff --cached --quiet; then echo "Rien de nouveau à publier"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Version web ${GITHUB_SHA::7}"
          git push -q origin gh-pages

  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
